<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安装 Floatime</title><link rel="stylesheet" href="style.css"></head>
<body><div class="window"><aside class="sidebar"><div class="brand"><span class="brand-icon">◷</span><span>FLOATIME</span></div><div class="sidebar-content"><p class="eyebrow">YOUR TIME, IN VIEW</p><h1>让时间，<br>留在视线里。</h1><p class="sidebar-copy">一款为桌面设计的悬浮时钟。<br>简单、安静，随时可见。</p><div class="clock" aria-hidden="true"><div class="clock-inner"><span class="hand hour"></span><span class="hand minute"></span><span class="pin"></span></div></div></div><div class="sidebar-footer">WINDOWS DESKTOP CLOCK <span>01 / 01</span></div></aside><main><div class="titlebar"><span>安装向导</span><button id="close" class="close" aria-label="关闭安装程序">×</button></div><div class="content"><div class="step"><span class="step-dot"></span><span id="step-label">准备安装</span></div><section id="ready"><h2>安装 Floatime</h2><p class="description">选择安装位置，然后开始安装。</p><label for="directory">安装位置</label><div class="directory"><input id="directory" type="text" spellcheck="false" aria-describedby="folder-hint"><button class="browse" id="browse">浏览</button></div><p class="hint" id="folder-hint">将在所选目录下创建 Floatime 文件夹，适用于当前用户。</p><div class="notice"><span class="notice-icon">✦</span><span>安装完成后，可通过右键菜单调整时钟设置。</span></div></section><section id="progress" hidden><h2>正在安装</h2><p class="description">请稍候，正在将 Floatime 安装到你的电脑。</p><div class="progress-track"><div class="progress-bar"></div></div><p class="hint">安装期间请不要关闭此窗口。</p></section><section id="done" hidden><div class="success-icon">✓</div><h2>安装完成</h2><p class="description">Floatime 已准备好，随时可以查看时间。</p><label class="checkbox"><input type="checkbox" id="run" checked> 立即启动 Floatime</label></section><p class="error" id="error" role="alert" hidden></p></div><div class="footer"><span id="footer-note">FLOATIME · 安装向导</span><div class="actions"><button class="cancel" id="cancel">取消</button><button class="primary" id="install">开始安装 <span>→</span></button><button class="primary" id="finish" hidden>完成 <span>→</span></button></div></div></main></div><script src="renderer.js"></script></body></html>
